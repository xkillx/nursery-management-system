<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>NurseryPro</title>
    <style>
        @media screen and (max-width: 600px) {
            .nurserypro-shell { width: 100% !important; border-radius: 0 !important; }
            .nurserypro-px { padding-left: 20px !important; padding-right: 20px !important; }
            .nurserypro-cta-btn { width: 100% !important; box-sizing: border-box !important; }
        }
    </style>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f6f8" style="background-color:#f4f6f8;padding:40px 16px;">
        <tr>
            <td align="center" valign="top">
                <!-- Main Card Shell -->
                <table class="nurserypro-shell" role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:600px;max-width:600px;background-color:#ffffff;border-radius:8px;overflow:hidden;">
                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding:40px 40px 24px;" class="nurserypro-px">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
                                <tr>
                                    <td valign="middle" style="padding-right:10px;">
                                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" aria-label="NurseryPro">
                                            <tr>
                                                <td align="center" valign="middle">
                                                    <svg width="22" height="22" viewBox="0 0 24 24" fill="#2563eb" xmlns="http://www.w3.org/2000/svg">
                                                        <path d="M12 2L4 10L12 18L20 10L12 2Z" fill="#2563eb"/>
                                                        <path d="M12 6L8 10L12 14L16 10L12 6Z" fill="#ffffff"/>
                                                    </svg>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td valign="middle">
                                        <span style="font-size:20px;font-weight:700;color:#000000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">{{if .NurseryName}}{{.NurseryName}}{{else}}Company{{end}}</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    
                    <!-- Content Block -->
                    {{template "content" .}}

                </table>
                
                <!-- Outer Footer (Below Card) -->
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;margin-top:32px;">
                    <tr>
                        <td align="center" style="font-size:12px;color:#888888;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
                            <p style="margin:0 0 4px;padding:0;">&copy; 2026 {{if .NurseryName}}{{.NurseryName}}{{else}}NurseryPro{{end}}. All rights reserved.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
