{{define "content"}}
<tr>
    <td class="nurserypro-heading nurserypro-px" style="padding:16px 32px 8px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:12px;">
            <tr>
                <td bgcolor="#fef2f2" style="background-color:#fef2f2;color:#dc2626;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px;border:1px solid #fecaca;">
                    Due Today
                </td>
            </tr>
        </table>
        <h1 style="margin:0;padding:0;font-size:24px;font-weight:800;color:#0f172a;">Payment Due Today</h1>
        <p class="nurserypro-text" style="margin:10px 0 0;padding:0;font-size:15px;color:#475569;line-height:1.5;">Your invoice for <strong>{{.ChildName}}</strong> is due today. Please make payment today to avoid late fees.</p>
    </td>
</tr>
<tr>
    <td style="padding:16px 32px;" class="nurserypro-px">
        <table class="nurserypro-card nurserypro-text" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f8fafc" style="background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;">
            <tr>
                <td style="padding:14px 20px;border-bottom:1px solid #e2e8f0;font-size:14px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td style="color:#64748b;font-weight:500;">Invoice Number</td>
                            <td align="right" style="font-weight:700;color:#0f172a;">{{.InvoiceNumber}}</td>
                        </tr>
                    </table>
                </td>
            </tr>
            {{if .DueDate}}
            <tr>
                <td style="padding:14px 20px;font-size:14px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td style="color:#64748b;font-weight:500;">Due Date</td>
                            <td align="right" style="font-weight:700;color:#0f172a;">{{.DueDate}}</td>
                        </tr>
                    </table>
                </td>
            </tr>
            {{end}}
        </table>
    </td>
</tr>
{{end}}
