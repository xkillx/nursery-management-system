{{define "content"}}
<style>
    .nurserypro-root { --accent: #16a34a; --accent-text: #15803d; }
</style>
<tr>
    <td class="nurserypro-heading nurserypro-px" style="padding:16px 32px 8px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:12px;">
            <tr>
                <td style="background-color:#f0fdf4;color:#16a34a;font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:4px 10px;border-radius:12px;border:1px solid #bbf7d0;">
                    Payment Received
                </td>
            </tr>
        </table>
        <h1 style="margin:0;font-size:24px;font-weight:800;color:#0f172a;letter-spacing:-0.5px;">Payment Received</h1>
        <p class="nurserypro-text" style="margin:10px 0 0;font-size:15px;color:#475569;line-height:1.5;">Thank you for your payment. We have received your payment for the invoice below.</p>
    </td>
</tr>
<tr>
    <td style="padding:16px 32px;" class="nurserypro-px">
        <table class="nurserypro-card nurserypro-text" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;">
            <tr>
                <td style="padding:14px 20px;border-bottom:1px solid #e2e8f0;font-size:14px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td style="color:#64748b;font-weight:500;">Invoice Number</td>
                            <td align="right" style="font-weight:700;color:#0f172a;">{{.InvoiceNumber}}</td>
                        </tr>
                    </table>
                </td>
            </tr>
            {{if .AmountPaid}}
            <tr>
                <td style="padding:14px 20px;border-bottom:1px solid #e2e8f0;font-size:14px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td style="color:#64748b;font-weight:500;">Amount Paid</td>
                            <td align="right" style="font-weight:700;color:#16a34a;">{{.AmountPaid}}</td>
                        </tr>
                    </table>
                </td>
            </tr>
            {{end}}
            {{if .PaymentDate}}
            <tr>
                <td style="padding:14px 20px;font-size:14px;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                        <tr>
                            <td style="color:#64748b;font-weight:500;">Payment Date</td>
                            <td align="right" style="font-weight:700;color:#0f172a;">{{.PaymentDate}}</td>
                        </tr>
                    </table>
                </td>
            </tr>
            {{end}}
        </table>
    </td>
</tr>
{{end}}
