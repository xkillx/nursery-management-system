@if (visible) {
  <section
    role="alert"
    aria-label="Over capacity rooms"
    class="flex flex-col gap-3 rounded-2xl border border-error-200 bg-error-50/90 p-4 sm:p-4.5 text-error-800 shadow-theme-xs transition-all duration-200 dark:border-error-500/30 dark:bg-error-500/15 dark:text-error-300"
    data-testid="over-capacity-banner"
  >
    <div class="flex items-center gap-2.5">
      <span class="inline-flex h-7 w-7 items-center justify-center rounded-xl bg-error-100 text-error-600 dark:bg-error-500/20 dark:text-error-400">
        <svg class="h-4 w-4 fill-current" viewBox="0 0 24 24">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zM12.75 6a.75.75 0 00-1.5 0v6a.75.75 0 001.5 0V6zm-1.5 9.75a.75.75 0 111.5 0 .75.75 0 01-1.5 0z" />
        </svg>
      </span>
      <h2 class="text-sm font-bold uppercase tracking-wider text-error-950 dark:text-error-100">
        {{ rooms.length === 1 ? 'Room over capacity' : 'Rooms over capacity' }}
      </h2>
    </div>
    <ul class="flex flex-wrap gap-x-4 gap-y-1.5 pl-9 text-sm font-semibold">
      @for (room of rooms; track room.id) {
        <li>
          <a
            [href]="'#room-' + room.id"
            class="underline decoration-error-300 underline-offset-2 transition hover:text-error-950 focus:outline-hidden focus:ring-2 focus:ring-error-500/30 dark:hover:text-error-100"
            [attr.aria-label]="'Jump to ' + room.name + ' row in the rooms table'"
          >
            {{ describe(room) }}
          </a>
        </li>
      }
    </ul>
  </section>
}
