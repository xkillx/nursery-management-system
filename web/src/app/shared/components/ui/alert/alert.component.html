<div
  class="rounded-2xl border p-4 sm:p-4.5 shadow-theme-xs transition-all duration-200"
  [class.p-3]="compact"
  [ngClass]="variantClasses.container"
  [attr.role]="roleAttribute"
>
  <div class="flex items-start gap-3.5" [class.gap-2.5]="compact">
    <div
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl transition-colors"
      [class.h-7]="compact"
      [class.w-7]="compact"
      [ngClass]="variantClasses.iconBadge"
    >
      <div [innerHTML]="iconSvg | safeHtml" class="flex items-center justify-center"></div>
    </div>

    <div class="min-w-0 flex-1 pt-0.5">
      @if (title) {
        <h4 class="text-sm font-bold tracking-tight mb-1" [ngClass]="variantClasses.title">
          {{ title }}
        </h4>
      }

      @if (message) {
        <p class="text-sm font-medium leading-relaxed" [ngClass]="variantClasses.message">{{ message }}</p>
      }

      <ng-content></ng-content>

      @if (showLink) {
        <a
          [routerLink]="linkHref"
          class="inline-flex items-center gap-1 mt-2.5 text-sm font-semibold underline underline-offset-2 transition-colors"
          [ngClass]="variantClasses.link"
        >
          {{ linkText }}
        </a>
      }
    </div>

    @if (dismissible) {
      <button
        type="button"
        (click)="dismissed.emit()"
        class="shrink-0 -mr-1 -mt-1 rounded-lg p-1.5 transition-colors focus:outline-hidden focus:ring-2"
        [ngClass]="variantClasses.dismiss"
        aria-label="Dismiss"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    }
  </div>
</div>
